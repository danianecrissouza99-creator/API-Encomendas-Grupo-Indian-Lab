name: seguranca

# Um job por regra que se verifica com um comando.
# O comando de cada job é o que está na coluna «Como se verifica» da política.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # PS-01 · docs/politicas/PS-01-auth.md · dono: Guilherme
  ps-01-autenticacao:
    runs-on: ubuntu-24.04
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Instalar dependências
        run: npm ci

      - name: node --test seguranca/ps-01-auth.js
        run: node --test seguranca/ps-01-auth.js

  # PS-02 · docs/politicas/PS-02-config.md · dono: Daniel
  ps-02-segredos:
    runs-on: ubuntu-24.04
    steps:
      - name: Obter código com o histórico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar gitleaks 8.30.1
        run: |
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep linux_x64.tar.gz gitleaks_8.30.1_checksums.txt | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: gitleaks detect --source . --config .gitleaks.toml --redact
        run: gitleaks detect --source . --config .gitleaks.toml --redact

  # PS-03 · docs/politicas/PS-03-encomendas.md · dono: Diogo
  ps-03-sql-parametrizado:
    runs-on: ubuntu-24.04
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar semgrep 1.185.0
        run: pip install semgrep==1.185.0

      - name: semgrep --config .semgrep/ --error --metrics=off src/
        run: semgrep --config .semgrep/ --error --metrics=off src/

  # PS-06 · docs/politicas/PS-06-dependencias.md · dona: Daniane
  ps-06-dependencias:
    runs-on: ubuntu-24.04
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Instalar exatamente o que está no lockfile
        run: npm ci

      - name: npm audit --audit-level=high
        run: npm audit --audit-level=high

  # PS-04 (regra 2) · docs/politicas/PS-04-utilizadores.md · dono: Fabio
  ps-04-exposicao-dados:
    runs-on: ubuntu-24.04
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Instalar dependências
        run: npm ci

      - name: node --test seguranca/ps-04-exposicao.js
        run: node --test seguranca/ps-04-exposicao.js

  # PS-05 (regra 2) · docs/politicas/PS-05-db.md · dona: Daniane · job criado de raiz
  ps-05-dados-pessoais:
    runs-on: ubuntu-24.04
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: node --test seguranca/ps-05-dados-pessoais.js
        run: node --test seguranca/ps-05-dados-pessoais.js
